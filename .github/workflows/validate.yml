name: Validate proposal

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check validator behavior
        run: python3 -m unittest discover -s tests -v
      - name: Check template
        run: python3 scripts/lint_build.py BUILD.MD
      - name: Check ready examples
        run: python3 scripts/lint_build.py --ready examples/word-count/BUILD.MD examples/reading-list/BUILD.MD
